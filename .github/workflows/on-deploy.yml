name: On Deploy (Workers, manual)

# 试点手动部署/回滚：wrangler 原生能力。
# - action=deploy（默认）：重新发布当前 main
# - action=rollback + version=<id>：`wrangler deployments list` 取 id，回滚到指定版本
# 需要仓 secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy or rollback'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: 'Version id for rollback (wrangler deployments list)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gate on deploy secret
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN not set, skipping deploy (tests already ran)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy or rollback backend Worker
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.action }}" = "rollback" ]; then
            if [ -z "${{ inputs.version }}" ]; then
              echo "::error::rollback needs inputs.version (see: wrangler deployments list)"
              exit 1
            fi
            npx -y wrangler@4 rollback "${{ inputs.version }}"
          else
            npx -y wrangler@4 deploy
          fi

      - name: Health check (public API)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -sf https://pilot-api.linkseek.net.cn/health 2>/dev/null || curl -sf https://pilot-consumer.workers.dev/health 2>/dev/null; then
              echo "Backend healthy!"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 10
          done
          echo "::error::Backend health check failed"
          exit 1
